ServerName localhost
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
LimitRequestBody 25165824

<FilesMatch "^(\..*|composer\.(json|lock)|.*\.(md|sql|ini|sh))$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/\.[^/]+(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/www/html/qc/docker>
    Require all denied
</Directory>
<Directory /var/www/html/qc/tests>
    Require all denied
</Directory>

# 업로드한 스크립트의 실행을 차단한다.
<DirectoryMatch "^/var/www/html/qc/(.*/)?uploads?(/|$)">
    php_flag engine off
    <FilesMatch "\.(php[0-9]?|phtml|phar|pht|inc)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
